version: "3.8"

# Langfuse full self-hosted stack
# Includes: API backend, web UI, worker, PostgreSQL, ClickHouse, MinIO, Redis
#
# Before starting:
#   1. Fill in POSTGRES_PASSWORD, NEXTAUTH_SECRET, ENCRYPTION_KEY, SALT
#   2. Run: docker compose up -d
#   3. Run: bash scripts/minio_setup.sh   (creates required MinIO bucket)

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:-changeme}@postgres:5432/langfuse
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme-use-openssl-rand-hex-32}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-changeme-use-openssl-rand-hex-32}
  SALT: ${SALT:-changeme}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ── ClickHouse (metrics store) ────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── MinIO (S3-compatible object storage for trace events) ─────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2023-05-18T00-05-36Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9000"   # Host port 9090 -> container 9000
    volumes:
      - minio_data:/data

  # ── Langfuse API Backend ──────────────────────────────────────────────────
  langfuse-app:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "3001:3000"    # API on host port 3001
                       # Use 0.0.0.0 binding (no 127.0.0.1 prefix) for cross-VM access
    environment:
      <<: *langfuse-env

  # ── Langfuse Web UI ───────────────────────────────────────────────────────
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      - langfuse-app
    ports:
      - "3000:3000"    # Web UI on host port 3000
    environment:
      <<: *langfuse-env
      LANGFUSE_NEXT_PUBLIC_SIGN_UP_DISABLED: "false"

  # ── Langfuse Worker (background jobs) ────────────────────────────────────
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      - langfuse-app
    environment:
      <<: *langfuse-env

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
